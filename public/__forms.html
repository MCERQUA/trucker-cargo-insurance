<!DOCTYPE html>
<html>
<head><title>Netlify Forms</title></head>
<body>
  <!-- Netlify form detection stub -->
  <form name="quote-request" netlify netlify-honeypot="bot-field" hidden>
    <input type="text" name="fullName" />
    <input type="text" name="dotNumber" />
    <input type="email" name="email" />
    <select name="fleetSize">
      <option>1-5 Vehicles</option>
      <option>6-20 Vehicles</option>
      <option>21-50 Vehicles</option>
      <option>50+ Vehicles</option>
    </select>
    <input type="hidden" name="bot-field" />
    <input type="tel" name="phone" />
    <input type="text" name="streetAddress" />
    <input type="text" name="city" />
    <input type="text" name="state" />
    <input type="text" name="zip" />
    <input type="text" name="fein" />
    <input type="text" name="yearBusinessStarted" />
    <input type="text" name="priorCarrierName" />
    <input type="text" name="priorPolicyNumber" />
    <input type="date" name="priorPolicyExpiration" />
    <textarea name="businessDescription"></textarea>
  </form>
  <form name="newsletter" netlify hidden>
    <input type="email" name="email" />
  </form>
</body>
</html>
